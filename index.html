<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffcad4, #b5e2fa, #f7ede2, #f5cac3); padding: 15px;
      color: #3d3a4e; box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.96); padding: 30px; border-radius: 24px;
      box-shadow: 0 15px 35px rgba(100, 110, 140, 0.15); max-width: 500px; width: 100%;
      border: 4px solid #fff; transition: all 0.3s ease; text-align: center;
    }
    h1 {
      font-size: 2.3rem; margin: 0 0 8px 0; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(45deg, #ff7b90, #6ca0dc, #8ac926); -webkit-background-clip: text;
      -webkit-text-fill-color: transparent; text-transform: uppercase;
    }
    p { color: #7d798a; font-size: 0.95rem; margin: 0 0 20px 0; line-height: 1.4; }
    
    .form-row {
      display: flex; gap: 8px; margin-bottom: 20px; align-items: center;
    }
    input {
      border: 2px solid #e2e8f0; border-radius: 12px; padding: 10px 14px; font-size: 0.9rem;
      outline: none; transition: 0.2s; background: #fafbfc; flex: 1;
    }
    input:focus { border-color: #a0c4ff; background: #fff; }
    input[type="number"] { max-width: 80px; }
    
    .add-btn {
      background-color: #ffd166; color: #4a3e1a; font-weight: 700; border: none;
      padding: 10px 16px; border-radius: 12px; cursor: pointer; transition: 0.2s;
    }
    .add-btn:hover { background-color: #ffca3a; transform: translateY(-1px); }

    .inventory-list {
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 25px;
      max-height: 100px; overflow-y: auto; padding: 4px;
    }
    .badge {
      background-color: #e8f0fe; color: #3b66ad; padding: 6px 12px; border-radius: 20px;
      font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
      border: 1px solid #d2e3fc; transition: all 0.2s;
    }
    .badge:hover { background-color: #ffd8be; color: #8f4819; border-color: #fec5bb; }

    .action-btn {
      background: linear-gradient(45deg, #ffadad, #bdb2ff); color: #352b54; border: none;
      padding: 16px 24px; font-size: 1.15rem; font-weight: 700; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 15px rgba(189, 178, 255, 0.4); transition: 0.2s; width: 100%; margin-bottom: 20px;
    }
    .action-btn:hover { transform: scale(1.02); box-shadow: 0 8px 18px rgba(189, 178, 255, 0.6); }
    .action-btn:active { transform: scale(0.98); }

    #result {
      background: #fdf6ec; border-radius: 16px; padding: 18px; min-height: 80px;
      display: flex; flex-direction: column; justify-content: center; border: 2px dashed #ffb5a7;
      opacity: 0; transform: translateY(8px); transition: 0.3s ease;
    }
    .item-tag { font-weight: 800; font-size: 1.25rem; color: #ff7b90; margin-bottom: 4px; }
    .idea { font-size: 0.95rem; color: #5f5a70; font-weight: 500; font-style: italic; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Inventory Management</h1>
    <p>Set counts, add hardware, and organize your setup with pastel magic!</p>
    
    <div class="form-row">
      <input type="text" id="hwType" placeholder="New Hardware, e.g. Access Point" required>
      <input type="number" id="hwQty" placeholder="Qty" value="1" min="0">
      <button onclick="addHardware()" class="add-btn">+ Add</button>
    </div>

    <div class="inventory-list" id="invList"></div>

    <button onclick="organize()" class="action-btn">Lets organize our inventory!</button>
    
    <div id="result">
      <div id="item" class="item-tag">Click the button above!</div>
      <div id="idea" class="idea"></div>
    </div>
  </div>

  <script>
    const inventory = {
      "server": { qty: 2, ideas: ["Dust off the mainframe and label it 'Not a Coffee Table'!", "Audit backups (yes, actually check them this time)!", "Install pastel LED strips to make it look friendly!"] },
      "switch": { qty: 4, ideas: ["Unspaghetti the ethernet cables and sort by color spectrum!", "Name your critical uplink ports after friendly starships!", "Gently wipe its shiny surface with a dry microfiber cloth."] },
      "pc": { qty: 8, ideas: ["Clean out 10,000 messy desktop shortcuts safely!", "Give the mechanical switches a delightful custom deep-cleaning keycap bath!", "Set an elegant aesthetic desktop wallpaper to match your vibes!"] },
      "computer": { qty: 3, ideas: ["Close those 99 open browser tabs to free up memory!", "Perform an update and verify everything runs gracefully!", "Gently wipe down the screens with safe screen-cleansing wipes!"] },
      "network": { qty: 1, ideas: ["Map your Wi-Fi signals and rename your home SSID to 'TellMyWiFiLoveHer'!", "Optimize access points for seamless pastel coverage!", "Reset your admin default passwords to strong unique keys."] }
    };

    const genericIdeas = [
      "Label this unit clearly with a cute pastel-colored tag!",
      "Log this item's serial number into your beautiful new master sheet!",
      "Run a diagnostic test and ensure the air vents are completely clear of dust!",
      "Check power source cables and run them through elegant cable sleeves!",
      "Take a moment to admire this piece of hardware for keeps!"
    ];

    function renderList() {
      const container = document.getElementById("invList");
      container.innerHTML = "";
      Object.keys(inventory).forEach(key => {
        const item = inventory[key];
        if (item.qty > 0) {
          const badge = document.createElement("div");
          badge.className = "badge";
          badge.innerHTML = `${key} <span style="background:#fff; padding:2px 6px; border-radius:10px; font-size:0.75rem; border: 1px solid #ddd;">${item.qty}</span>`;
          container.appendChild(badge);
        }
      });
    }

    function addHardware() {
      const typeInput = document.getElementById("hwType");
      const qtyInput = document.getElementById("hwQty");
      const name = typeInput.value.trim().toLowerCase();
      const qty = parseInt(qtyInput.value) || 0;
      
      if (!name) return;
      if (inventory[name]) {
        inventory[name].qty = qty;
      } else {
        inventory[name] = { qty: qty, ideas: [...genericIdeas] };
      }
      
      typeInput.value = "";
      qtyInput.value = "1";
      renderList();
    }

    function organize() {
      const activeKeys = Object.keys(inventory).filter(key => inventory[key].qty > 0);
      if (activeKeys.length === 0) {
        const res = document.getElementById("result");
        document.getElementById("item").textContent = "Inventory is empty!";
        document.getElementById("idea").textContent = "Add hardware and set counts above to begin!";
        res.style.opacity = "1"; res.style.transform = "translateY(0)";
        return;
      }
      
      const chosenKey = activeKeys[Math.floor(Math.random() * activeKeys.length)];
      const itemData = inventory[chosenKey];
      const randomIdea = itemData.ideas[Math.floor(Math.random() * itemData.ideas.length)];
      
      const res = document.getElementById("result");
      res.style.opacity = "0";
      setTimeout(() => {
        document.getElementById("item").textContent = `${chosenKey.toUpperCase()} (Total: ${itemData.qty})`;
        document.getElementById("idea").textContent = `"${randomIdea}"`;
        res.style.opacity = "1"; res.style.transform = "translateY(0)";
      }, 200);
    }

    renderList();
  </script>
</body>
</html>
